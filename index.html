      }

        --surface: #ffffff;

        --muted: #4c5575;
        --primary: #4f5dff;
        --primary-2: #3eb8ff;
        --card-border: rgba(26, 33, 68, 0.15);

      }

        width: min(1120px, 92%);

      }

      .section {
        padding: 64px 0;
      }

        position: sticky;
        top: 10px;
        z-index: 10;
        margin-top: 10px;
        border: 1px solid var(--card-border);
        border-radius: 16px;
        background: var(--topbar-bg);
        backdrop-filter: blur(8px);
        padding: 10px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .brand {
        font-weight: 800;
        font-size: 18px;
        letter-spacing: -0.02em;
      }

      .control-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .chip {
        border: 1px solid var(--card-border);
        border-radius: 10px;
        background: var(--chip-bg);
        color: var(--text);
        padding: 8px 10px;
        min-height: 38px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      .chip[aria-pressed="true"] {
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: #ffffff;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid var(--card-border);
        background: rgba(255, 255, 255, 0.04);
        color: #d6ddff;
        font-size: 13px;
        font-weight: 600;
      }

      h1,
      h2,
      h3 {
        margin: 0 0 16px;
        line-height: 1.15;
        letter-spacing: -0.02em;
      }

      h1 {
        font-size: clamp(30px, 7vw, 58px);
      }

      h2 {
        font-size: clamp(24px, 5vw, 42px);
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: clamp(16px, 3.8vw, 18px);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 50px;
        padding: 0 22px;
        border-radius: 12px;
        border: 1px solid transparent;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: #fff;
        font-weight: 700;
        font-size: 15px;
        transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(109, 128, 255, 0.25);
      }

      .btn:active {
        transform: translateY(0);
      }

      .btn.secondary {
        background: transparent;
        border-color: var(--card-border);
      }

      .hero {
        padding-top: 22px;
      }

      .hero-grid {
        display: grid;
        gap: 28px;
      }

      .hero-copy p {
        margin-top: 18px;
      }

      .hero-actions {
        margin-top: 28px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .phone-mockup-wrap {
        display: flex;
        justify-content: center;
      }

      .phone-mockup {
        width: min(320px, 100%);
        border-radius: 34px;
        border: 1px solid var(--card-border);
        background: linear-gradient(180deg, #1d2448 0%, #141a33 100%);
        padding: 18px 14px;
        box-shadow: 0 30px 80px rgba(10, 13, 30, 0.7);
      }

      .phone-topbar {
        width: 38%;
        height: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.25);
        margin: 0 auto 14px;
      }

      .phone-card {
        border: 1px solid var(--card-border);
        border-radius: 14px;
        padding: 12px;
        background: rgba(255, 255, 255, 0.03);
        margin-bottom: 10px;
      }

      .phone-card strong {
        font-size: 12px;
        color: #d9e0ff;
        display: block;
        margin-bottom: 8px;
      }

      .phone-card p {
        font-size: 14px;
        color: #ecf0ff;
      }

      html[data-theme="light"] .phone-mockup {
        background: linear-gradient(180deg, #f8f9ff 0%, #e9eeff 100%);
      }

      html[data-theme="light"] .phone-card p,
      html[data-theme="light"] .phone-card strong {
        color: #1a2144;
      }

      .highlight-box {
        margin-top: 18px;
        padding: 18px;
        border-radius: 16px;
        border: 1px solid var(--card-border);
        background: rgba(92, 213, 255, 0.08);
      }

      .solution-prefix {
        color: var(--text);
      }

      .steps,
      .feature-grid,
      .audience-grid {
        margin-top: 30px;
        display: grid;
        gap: 14px;
      }

      .step,
      .card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--card-border);
        border-radius: var(--radius);
        padding: 18px;
      }

      .step-index {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(111, 123, 255, 0.22);
        border: 1px solid rgba(111, 123, 255, 0.4);
        font-weight: 700;
        margin-bottom: 10px;
      }

      .feature-grid .card h3,
      .audience-grid .card h3 {
        font-size: 19px;
        margin-bottom: 10px;
      }

      .section-cta {
        padding: 76px 0 82px;
      }

      .cta-wrap {
        text-align: center;
        padding: 30px 20px;
        border-radius: 24px;
        border: 1px solid var(--card-border);
        background: linear-gradient(155deg, rgba(111, 123, 255, 0.22), rgba(92, 213, 255, 0.12));

      .store-buttons {
        margin-top: 24px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }

      .fade-in {
        opacity: 0;
        transform: translateY(18px);
        transition: opacity 0.5s ease, transform 0.5s ease;
      }

      .fade-in.show {
        opacity: 1;
        transform: translateY(0);
      }

      .footer-note {
        margin-top: 18px;
        font-size: 14px;
      }

          gap: 40px;
        }

        .steps {
          grid-template-columns: repeat(3, 1fr);
        }

        .feature-grid {
          grid-template-columns: repeat(3, 1fr);
        }

        .audience-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
    </style>

      const COUNTRY_LANG_MAP = {
        RU: "ru",
        RS: "sr",
        ME: "sr",
        BA: "sr",
        HR: "sr",
        SI: "sr",
      };

      const trackEvent = (eventName, params = {}) => {
        if (typeof window.gtag === "function") {
          window.gtag("event", eventName, params);
        }
        if (typeof window.ym === "function" && METRIKA_COUNTER_ID) {
          window.ym(METRIKA_COUNTER_ID, "reachGoal", eventName);
        }
      };

      const setMeta = (lang) => {
        const bundle = TEXTS[lang] || TEXTS.en;
        document.title = bundle.meta_title;
        const desc = document.querySelector('meta[name="description"]');
        const ogTitle = document.querySelector('meta[property="og:title"]');
        const ogDesc = document.querySelector('meta[property="og:description"]');
        const twTitle = document.querySelector('meta[name="twitter:title"]');
        const twDesc = document.querySelector('meta[name="twitter:description"]');
        if (desc) desc.setAttribute("content", bundle.meta_description);
        if (ogTitle) ogTitle.setAttribute("content", bundle.meta_og_title);
        if (ogDesc) ogDesc.setAttribute("content", bundle.meta_og_description);
        if (twTitle) twTitle.setAttribute("content", bundle.meta_og_title);
        if (twDesc) twDesc.setAttribute("content", bundle.meta_og_description);
      };

      const applyLanguage = (lang, shouldPersist = true) => {
        const bundle = TEXTS[lang] || TEXTS.en;
        document.documentElement.lang = lang;
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          if (bundle[key]) {
            el.textContent = bundle[key];
          }
        });
        setMeta(lang);
        document.querySelectorAll(".js-lang").forEach((btn) => {
          btn.setAttribute("aria-pressed", String(btn.dataset.lang === lang));
        });
        if (shouldPersist) {
          localStorage.setItem("unfolda_lang", lang);
        }
        updateThemeToggleText();
      };

      const applyTheme = (theme, shouldPersist = true) => {
        const resolvedTheme = theme === "light" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", resolvedTheme);
        const themeButton = document.getElementById("themeToggle");
        if (themeButton) {
          themeButton.setAttribute("aria-pressed", String(resolvedTheme === "light"));
        }
        if (shouldPersist) {
          localStorage.setItem("unfolda_theme", resolvedTheme);
        }
        updateThemeToggleText();
      };

      const updateThemeToggleText = () => {
        const currentLang = document.documentElement.lang || "en";
        const currentTheme = document.documentElement.getAttribute("data-theme") || "dark";
        const bundle = TEXTS[currentLang] || TEXTS.en;
        const themeButton = document.getElementById("themeToggle");
        if (!themeButton) return;
        themeButton.textContent = currentTheme === "dark" ? bundle.theme_toggle_dark : bundle.theme_toggle_light;
      };

      const detectCountryCode = async () => {
        try {
          const response = await fetch("https://ipapi.co/json/");
          if (!response.ok) return null;
          const data = await response.json();
          if (data && typeof data.country_code === "string") {
            return data.country_code.toUpperCase();
          }
          return null;
        } catch {
          return null;
        }
      };

      const initLanguage = async () => {
        const persisted = localStorage.getItem("unfolda_lang");
        if (persisted && TEXTS[persisted]) {
          applyLanguage(persisted, false);
          return;
        }
        const countryCode = await detectCountryCode();
        const geoLang = (countryCode && COUNTRY_LANG_MAP[countryCode]) || "en";
        applyLanguage(geoLang, false);
      };

      document.querySelectorAll(".js-track").forEach((element) => {
        element.addEventListener("click", () => {
          const name = element.getAttribute("data-track") || "cta_click";
          trackEvent(name, {
            link_text: element.textContent.trim(),
            link_url: element.getAttribute("href"),
          });
        });
      });

      document.querySelectorAll(".js-lang").forEach((button) => {
        button.addEventListener("click", () => {
          const selectedLang = button.dataset.lang || "en";
          applyLanguage(selectedLang);
          trackEvent("language_switch", { language: selectedLang });
        });
      });

      const persistedTheme = localStorage.getItem("unfolda_theme");
      const systemPrefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
      applyTheme(persistedTheme || (systemPrefersLight ? "light" : "dark"), false);

      const themeToggle = document.getElementById("themeToggle");
      if (themeToggle) {
        themeToggle.addEventListener("click", () => {
          const current = document.documentElement.getAttribute("data-theme") || "dark";
          const next = current === "dark" ? "light" : "dark";
          applyTheme(next);
          trackEvent("theme_switch", { theme: next });
        });
      }

      initLanguage();

      document.getElementById("year").textContent = String(new Date().getFullYear());

      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("show");
              observer.unobserve(entry.target);
            }
          });
        },
        { threshold: 0.2 }
      );

      document.querySelectorAll(".fade-in").forEach((el) => observer.observe(el));
    </script>
