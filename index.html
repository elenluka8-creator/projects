<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unfolda — Read books in original languages</title>
    <meta
      name="description"
      content="Unfolda helps you read books in original languages with parallel paragraphs. Upload EPUB/FB2/PDF and learn naturally without switching apps."
    />
    <meta
      name="keywords"
      content="Unfolda, language learning, read in original language, English, Serbian, Russian, EdTech"
    />
    <meta name="robots" content="index,follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Unfolda" />
    <meta property="og:title" content="Read your favorite books in original languages with Unfolda" />
    <meta
      property="og:description"
      content="Upload your own books and read with parallel paragraphs. Learn languages naturally and stay in flow."
    />
    <meta property="og:url" content="https://www.unfolda.ai/" />
    <meta property="og:image" content="https://www.unfolda.ai/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Unfolda — read in original language and understand every word" />
    <meta
      name="twitter:description"
      content="Parallel paragraphs, smart AI translation, and your own books in one app."
    />
    <meta name="twitter:image" content="https://www.unfolda.ai/og-image.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <div class="container">
        <header class="topbar fade-in" aria-label="Panel controls">
          <a class="brand" href="#" aria-label="Unfolda home">Unfolda</a>
          <div class="control-row">
            <button class="chip js-lang" data-lang="ru" aria-pressed="false">RU</button>
            <button class="chip js-lang" data-lang="sr" aria-pressed="false">SR</button>
            <button class="chip js-lang" data-lang="en" aria-pressed="false">EN</button>
            <button class="chip js-theme js-track" data-track="theme_toggle" id="themeToggle" aria-pressed="false"></button>
          </div>
        </header>
      </div>

      <section class="section hero">
        <div class="container hero-grid">
          <div class="hero-copy fade-in">
            <span class="eyebrow" data-i18n="hero_eyebrow"></span>
            <h1 data-i18n="hero_title"></h1>
            <p data-i18n="hero_subtitle"></p>
            <div class="hero-actions">
              <a class="btn js-track" data-track="hero_start_free" href="#cta" data-i18n="hero_cta"></a>
              <a class="btn secondary js-track" data-track="hero_to_jobs" href="https://www.unfolda.ai/en/jobs" data-i18n="hero_site"></a>
            </div>
          </div>

          <div class="phone-mockup-wrap fade-in">
            <div class="phone-mockup" aria-label="Интерфейс приложения Unfolda">
              <div class="phone-topbar"></div>
              <div class="phone-card">
                <strong data-i18n="mockup_l1"></strong>
                <p data-i18n="mockup_p1"></p>
              </div>
              <div class="phone-card">
                <strong data-i18n="mockup_l2"></strong>
                <p data-i18n="mockup_p2"></p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="container fade-in">
          <h2 data-i18n="problem_title"></h2>
          <p data-i18n="problem_text"></p>
          <div class="highlight-box">
            <p>
              <strong class="solution-prefix" data-i18n="solution_prefix"></strong>
              <span data-i18n="solution_text"></span>
            </p>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="container fade-in">
          <h2 data-i18n="how_title"></h2>
          <div class="steps">
            <article class="step">
              <span class="step-index">1</span>
              <h3 data-i18n="step1_title"></h3>
              <p data-i18n="step1_text"></p>
            </article>
            <article class="step">
              <span class="step-index">2</span>
              <h3 data-i18n="step2_title"></h3>
              <p data-i18n="step2_text"></p>
            </article>
            <article class="step">
              <span class="step-index">3</span>
              <h3 data-i18n="step3_title"></h3>
              <p data-i18n="step3_text"></p>
            </article>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="container fade-in">
          <h2 data-i18n="features_title"></h2>
          <div class="feature-grid">
            <article class="card">
              <h3 data-i18n="f1_title"></h3>
              <p data-i18n="f1_text"></p>
            </article>
            <article class="card">
              <h3 data-i18n="f2_title"></h3>
              <p data-i18n="f2_text"></p>
            </article>
            <article class="card">
              <h3 data-i18n="f3_title"></h3>
              <p data-i18n="f3_text"></p>
            </article>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="container fade-in">
          <h2 data-i18n="audience_title"></h2>
          <div class="audience-grid">
            <article class="card">
              <h3 data-i18n="a1_title"></h3>
              <p data-i18n="a1_text"></p>
            </article>
            <article class="card">
              <h3 data-i18n="a2_title"></h3>
              <p data-i18n="a2_text"></p>
            </article>
            <article class="card">
              <h3 data-i18n="a3_title"></h3>
              <p data-i18n="a3_text"></p>
            </article>
          </div>
        </div>
      </section>

      <section class="section section-cta" id="cta">
        <div class="container">
          <div class="cta-wrap fade-in">
            <h2 data-i18n="cta_title"></h2>
            <p data-i18n="cta_text"></p>
            <div class="store-buttons">
              <a class="btn js-track" data-track="download_appstore" href="https://apps.apple.com" target="_blank" rel="noopener noreferrer" data-i18n="cta_appstore"></a>
              <a
                class="btn secondary js-track"
                data-track="download_google_play"
                href="https://play.google.com/store"
                target="_blank"
                rel="noopener noreferrer"
                data-i18n="cta_google_play"></a>
            </div>
            <p class="footer-note"><span data-i18n="footer_note"></span> © <span id="year"></span> Unfolda.</p>
          </div>
        </div>
      </section>
    </main>

    <script src="./locales.js" defer></script>
    <script src="./app.js" defer></script>
  </body>
</html>
