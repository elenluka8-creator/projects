  <body>
    <main>
      <div class="container">
        <header class="topbar fade-in" aria-label="Panel controls">
          <a class="brand" href="https://unfolda.ai" aria-label="Unfolda home" target="_blank" rel="noopener noreferrer">Unfolda</a>
          <div class="control-row" id="languageSwitcher">
            <button class="chip js-lang" data-lang="ru" aria-pressed="false">RU</button>
            <button class="chip js-lang" data-lang="sr" aria-pressed="false">SR</button>
            <button class="chip js-lang" data-lang="en" aria-pressed="false">EN</button>
            <button class="chip js-lang" data-lang="es" aria-pressed="false">ES</button>
            <button class="chip js-theme js-track" data-track="theme_toggle" id="themeToggle" aria-pressed="false"></button>
          </div>
        </header>
        <div class="lang-notice fade-in" id="langNotice" hidden>
          <p class="lang-notice-text" id="langNoticeText"></p>
          <div class="lang-notice-actions">
            <button class="chip chip-ghost js-lang-open js-track" data-track="language_notice_change" data-i18n="lang_notice_change"></button>
            <button class="chip chip-ghost js-lang-dismiss js-track" data-track="language_notice_dismiss" data-i18n="lang_notice_dismiss"></button>
          </div>
        </div>
      </div>

      <section class="section hero">
        <div class="container hero-grid">
          <div class="hero-copy fade-in">
            <span class="eyebrow" data-i18n="hero_eyebrow"></span>
            <h1 data-i18n="hero_title"></h1>
            <p data-i18n="hero_subtitle"></p>
            <div class="hero-actions">
              <a class="btn js-track" data-track="hero_start_free" href="#cta" data-i18n="hero_cta"></a>
              <a
                class="btn secondary js-track"
                data-track="hero_to_website"
                href="https://unfolda.ai"
                target="_blank"
                rel="noopener noreferrer"
                data-i18n="hero_site"></a>
            </div>
            <div class="hero-proof">
              <span class="hero-proof-chip" data-i18n="hero_proof_1"></span>
              <span class="hero-proof-chip" data-i18n="hero_proof_2"></span>
              <span class="hero-proof-chip" data-i18n="hero_proof_3"></span>
            </div>
          </div>

          <div class="hero-visual fade-in">
            <div class="phone-mockup-wrap">
              <div class="phone-mockup" aria-label="Unfolda app interface">
                <div class="phone-topbar"></div>
                <div class="phone-card">
                  <strong data-i18n="mockup_l1"></strong>
                  <p data-i18n="mockup_p1"></p>
                </div>
                <div class="phone-card">
                  <strong data-i18n="mockup_l2"></strong>
                  <p data-i18n="mockup_p2"></p>
                </div>
              </div>
            </div>
            <div class="mascot-card" aria-label="Unfolda mascot">
              <img class="mascot-image" src="./owl-mascot.svg" alt="Uno the Owl" loading="lazy" />
              <div>
                <strong data-i18n="mascot_title"></strong>
                <p data-i18n="mascot_text"></p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="section section-proof">
        <div class="container fade-in">
          <h2 data-i18n="proof_title"></h2>
          <p data-i18n="proof_subtitle"></p>
          <div class="proof-grid">
            <article class="card">
              <h3 data-i18n="proof1_value"></h3>
              <p data-i18n="proof1_text"></p>
            </article>
            <article class="card">
              <h3 data-i18n="proof2_value"></h3>
              <p data-i18n="proof2_text"></p>
            </article>
            <article class="card">
              <h3 data-i18n="proof3_value"></h3>
              <p data-i18n="proof3_text"></p>
            </article>
          </div>
          <div class="trust-row">
            <span class="trust-pill" data-i18n="trust_1"></span>
            <span class="trust-pill" data-i18n="trust_2"></span>
            <span class="trust-pill" data-i18n="trust_3"></span>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="container fade-in">
          <h2 data-i18n="problem_title"></h2>
          <p data-i18n="problem_text"></p>

            <p>
              <strong class="solution-prefix" data-i18n="solution_prefix"></strong>
              <span data-i18n="solution_text"></span>

        </div>

          <h2 data-i18n="features_title"></h2>

            <article class="card">
              <h3 data-i18n="f1_title"></h3>
              <p data-i18n="f1_text"></p>

              <h3 data-i18n="f2_title"></h3>
              <p data-i18n="f2_text"></p>

              <p data-i18n="f3_text"></p>

              <p data-i18n="a1_text"></p>

            <article class="card">
              <h3 data-i18n="a2_title"></h3>
              <p data-i18n="a2_text"></p>
            </article>
            <article class="card">
              <h3 data-i18n="a3_title"></h3>
              <p data-i18n="a3_text"></p>

            <details class="faq-item">

              <p data-i18n="faq_a1"></p>

            <details class="faq-item">
